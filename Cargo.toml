[package]
name = "xsk-core"
version = "0.3.0"
authors = ["Douglas Gray <dbgray01@gmail.com>", "Rainer Stademann <rainer@spacebandit.de>"]
edition = "2024"
description = "Rust bindings for Linux AF_XDP sockets"
license = "MIT"
repository = "https://github.com/ninegamma/xsk-core"
readme = "README.md"
keywords = ["AF_XDP", "XSK", "eBPF", "XDP"]

[workspace]
members = ["xdpcore-sys"]
resolver = "3"

[features]
# Compatibility flag: xdpcore-sys always uses cc and writes only to OUT_DIR.
use_cc_build = []

[package.metadata.docs.rs]
features = ["use_cc_build"]

[dependencies]
bitflags = "2.13.1"
cfg-if = "1.0.4"
libc = "0.2.189"
xdpcore-sys = { version = "0.1.0", path = "xdpcore-sys" }
log = "0.4.33"

[dev-dependencies]
anyhow = "1.0.97"
crossbeam-channel = "0.5.15"
ctrlc = "3.4.6"
env_logger = "0.11.8"
etherparse = "0.21.0"
futures = "0.3.31"
rand = "0.10.2"
rtnetlink = "0.18.0"
serial_test = "4.0.1"
structopt = "0.3.26"

[dev-dependencies.tokio]
version = "1.44.2"
default-features = false
features = ["rt-multi-thread", "macros", "sync", "signal", "time"]
